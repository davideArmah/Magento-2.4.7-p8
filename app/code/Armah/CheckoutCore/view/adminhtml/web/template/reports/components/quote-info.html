<div class="archeckout-quotes-count">
    <p class="archeckout-label" data-bind="i18n: 'Number of Quotes*'"></p>
    <span class="archeckout-value" data-bind="text: quoteTotalCount"></span>
    <p class="archeckout-note" data-bind="i18n: '* all orders as well as active and abandoned carts are considered as a quote'"></p>
    <div class="archeckout-sections-rate">
        <div id="sections-rate-graph" class="archeckout-graph" data-bind='mageInit:{"armahSectionsRate" : {"graphicInfo":graphicInfo}}'></div>
        <p class="archeckout-note" data-bind="i18n: '* form is completed if all mandatory fields are filled or, if the form is made up of only optional fields, when at least one field is filled'"></p>
    </div>
</div>
